[project]
name = "akasheet-render-companion"
version = "0.1.0"
description = "AKAsheet local ACE-Step render worker"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.0",
]

[project.scripts]
akasheet-render = "akasheet_render.worker:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
